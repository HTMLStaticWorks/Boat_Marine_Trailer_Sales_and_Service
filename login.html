<!DOCTYPE html>
<html lang="en" dir="ltr" class="dark">
<head>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Account Access — MarineHaul Pro</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config={darkMode:'class',theme:{extend:{colors:{navy:{DEFAULT:'#0a1628',800:'#0d1f3c',700:'#1e2a3b',600:'#2d3f55'},gold:{DEFAULT:'#c9a84c',light:'#e8c76b',dark:'#b8943a'},silver:'#a8b4c0'},fontFamily:{sans:['Inter','sans-serif'],display:['Barlow Condensed','sans-serif']}}}}</script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Barlow+Condensed:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/custom.css" />
  <style id="theme-rtl-fixes">
    html:not(.dark) body { background-color: #f8fafc !important; color: #0f172a !important; }
    html:not(.dark) .bg-navy { background-color: #e2e8f0 !important; }
    html:not(.dark) .bg-navy\/90 { background-color: rgba(248,250,252,0.95) !important; }
    html:not(.dark) .bg-navy-800 { background-color: #f1f5f9 !important; }
    html:not(.dark) .bg-navy-700 { background-color: #ffffff !important; border-color: #e2e8f0 !important; }
    html:not(.dark) .text-white { color: #0f172a !important; }
    html:not(.dark) .text-gray-100, html:not(.dark) .text-gray-200 { color: #1e293b !important; }
    html:not(.dark) .text-gray-300, html:not(.dark) .text-gray-400 { color: #475569 !important; }
    html:not(.dark) .text-gray-500 { color: #64748b !important; }
    html:not(.dark) .border-white\/5, html:not(.dark) .border-white\/8, html:not(.dark) .border-white\/10, html:not(.dark) .border-white\/15 { border-color: #e2e8f0 !important; }
    html:not(.dark) .bg-white\/5 { background-color: rgba(0,0,0,0.03) !important; }
    html:not(.dark) .bg-white\/10 { background-color: rgba(0,0,0,0.06) !important; }
    html:not(.dark) .hover\:bg-white\/10:hover { background-color: rgba(0,0,0,0.08) !important; }
    html:not(.dark) .hover\:bg-white\/5:hover { background-color: rgba(0,0,0,0.04) !important; }
    html[dir="rtl"] { text-align: right; }
    html[dir="rtl"] .translate-x-full { transform: translateX(-100%) !important; }
    html[dir="rtl"] .-translate-x-full { transform: translateX(100%) !important; }
  </style>
</head>

<body class="bg-navy-800 text-gray-100 font-sans min-h-screen flex items-center justify-center pt-20 pb-12 px-4 relative sm:py-12">

  <!-- Theme / RTL Toggles -->
  <div class="absolute top-4 right-4 sm:top-6 sm:right-6 flex items-center gap-2 z-50">
    <button data-toggle-theme aria-label="Toggle theme" class="w-10 h-10 flex items-center justify-center rounded-lg bg-navy-700/50 hover:bg-navy-700 border border-white/10 text-gray-300 hover:text-gold transition-all shadow-lg backdrop-blur-md">
      <span data-theme-icon>☀️</span>
    </button>
    <button data-toggle-rtl aria-label="Toggle RTL" class="w-10 h-10 flex items-center justify-center rounded-lg bg-navy-700/50 hover:bg-navy-700 border border-white/10 text-gray-300 hover:text-gold transition-all shadow-lg backdrop-blur-md text-xs font-bold">
      <span data-rtl-label>RTL</span>
    </button>
  </div>  <div class="w-full max-w-md">
    <!-- Card Outer -->
    <div class="bg-navy-700 border border-white/8 rounded-2xl shadow-2xl shadow-black/40 p-8 sm:p-10">

      <!-- Brand -->
      <div class="flex flex-col items-center mb-8">
        <a href="index.html" class="flex items-center gap-3 hover:opacity-90 transition-opacity mb-5">
          <div class="w-11 h-11 bg-gold-gradient rounded-xl flex items-center justify-center shadow-lg shadow-gold/20 flex-shrink-0">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M2 18h20M4 18V10l4-3 4 3 4-3 4 3v8M8 18v-4h2v4M14 18v-4h2v4" stroke="#0a1628" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="6" cy="20" r="2" fill="#0a1628"/><circle cx="18" cy="20" r="2" fill="#0a1628"/></svg>
          </div>
          <div class="leading-tight">
            <span class="font-display font-800 text-xl text-white tracking-wide block">MARINEHAULPRO</span>
            <span class="block text-[10px] text-gold uppercase tracking-widest font-semibold">Trailer Sales &amp; Service</span>
          </div>
        </a>
        <h1 class="font-display font-800 text-2xl text-white tracking-wide">ACCOUNT ACCESS</h1>
        <p class="mt-1.5 text-sm text-gray-400 text-center max-w-xs">Sign in to manage your builds, service history, and orders.</p>
      </div>

      <!-- Social Login Buttons -->
      <div class="space-y-3 mb-6">
        <button type="button" class="w-full flex items-center justify-center gap-3 px-4 py-3 rounded-xl border border-white/12 bg-white/5 hover:bg-white/10 text-white font-semibold text-sm transition-all duration-200">
          <!-- Google SVG -->
          <svg width="18" height="18" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.3 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34.5 6.9 29.5 4.8 24 4.8 12.8 4.8 3.8 13.8 3.8 25S12.8 45.2 24 45.2 44.2 36.2 44.2 25c0-1.5-.2-2.9-.6-4.5z"/><path fill="#FF3D00" d="M6.3 15.6l6.6 4.8C14.5 16.8 19 14 24 14c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34.5 8.3 29.5 6 24 6 16.2 6 9.5 9.9 6.3 15.6z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.3 35.4 26.8 36 24 36c-5.3 0-9.7-3.4-11.3-8H6.3C9.5 34.3 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.3 4.1-4.3 5.5l6.2 5.2C37 38.7 44.2 32 44.2 25c0-1.5-.2-2.9-.6-4.5z"/></svg>
          Continue with Google
        </button>
        <button type="button" class="w-full flex items-center justify-center gap-3 px-4 py-3 rounded-xl border border-white/12 bg-white/5 hover:bg-white/10 text-white font-semibold text-sm transition-all duration-200">
          <!-- Apple SVG -->
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.8-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M13 3.5c.73-.83 1.94-1.46 2.94-1.5.13 1.17-.34 2.35-1.04 3.19-.69.85-1.83 1.51-2.95 1.42-.15-1.15.41-2.35 1.05-3.11z"/></svg>
          Continue with Apple
        </button>
      </div>

      <!-- Divider -->
      <div class="flex items-center gap-3 mb-6">
        <div class="flex-1 h-px bg-white/10"></div>
        <span class="text-xs text-gray-500 uppercase tracking-widest font-medium">or email</span>
        <div class="flex-1 h-px bg-white/10"></div>
      </div>

      <!-- Form -->
      <form id="login-form" class="space-y-5" novalidate>
        <div>
          <label for="login-email" class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2">Email Address</label>
          <input id="login-email" name="email" type="email" autocomplete="email" required placeholder="your@email.com"
            class="w-full bg-navy border border-white/10 text-white rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-gold/60 transition-colors placeholder-gray-600">
        </div>

        <div>
          <label for="login-password" class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2">Password</label>
          <div class="relative">
            <input id="login-password" name="password" type="password" autocomplete="current-password" required placeholder="••••••••"
              class="w-full bg-navy border border-white/10 text-white rounded-xl px-4 py-3 pr-12 text-sm focus:outline-none focus:border-gold/60 transition-colors placeholder-gray-600">
            <button type="button" onclick="togglePwd('login-password', this)" aria-label="Toggle password visibility"
              class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-500 hover:text-gold transition-colors p-1">
              <svg class="w-5 h-5 eye-open" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
              </svg>
              <svg class="w-5 h-5 eye-closed hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21"/>
              </svg>
            </button>
          </div>
        </div>

        <div class="flex items-center justify-between">
          <div class="flex items-center gap-2">
            <input id="remember-me" name="remember-me" type="checkbox" class="custom-checkbox">
            <label for="remember-me" class="text-sm text-gray-400 cursor-pointer">Remember me</label>
          </div>
          <a href="#" class="text-sm font-semibold text-gold hover:text-gold-light transition-colors">Forgot password?</a>
        </div>

        <button type="submit" class="w-full btn-gold py-3.5 rounded-xl font-bold text-base shadow-lg shadow-gold/20 flex justify-center">
          Sign In
        </button>
      </form>

      <p class="mt-6 text-center text-sm text-gray-400">
        New to MarineHaul Pro?
        <a href="signup.html" class="font-bold text-gold hover:text-gold-light transition-colors">Create an account</a>
      </p>
    </div>
  </div>

  <script>
    function togglePwd(inputId, btn) {
      const input = document.getElementById(inputId);
      const show = input.type === 'password';
      input.type = show ? 'text' : 'password';
      btn.querySelector('.eye-open').classList.toggle('hidden', show);
      btn.querySelector('.eye-closed').classList.toggle('hidden', !show);
    }
  </script>
  <script src="js/main.js"></script>
</body>
</html>
